[package]
name = "truckcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ts-save-core = { path = "../save-core" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit", "system_fonts", "clipboard", "links"] }
rfd = { version = "0.18", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "7"
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "1"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wayland", "x11"] }
rfd = { version = "0.18", default-features = false, features = ["gtk3"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(windows)'.dependencies]
ed25519-dalek = "2.2"
hex = "0.4"
sha2.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
scs-codec = { path = "../scs-codec" }
