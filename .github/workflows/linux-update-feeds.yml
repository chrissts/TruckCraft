name: Publish Linux update feeds

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Stable release published]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: linux-update-feeds
  cancel-in-progress: false

jobs:
  check-trigger:
    name: Confirm update feed trigger
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.event == 'release' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    permissions:
      actions: read
    outputs:
      publish: ${{ steps.trigger.outputs.publish }}
    steps:
      - name: Check publication result
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          stable=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/attempts/$RELEASE_RUN_ATTEMPT/jobs" \
            --jq '[.jobs[] | select(.name == "Confirm stable publication" and .conclusion == "success")] | length')
          if [[ "$stable" == 1 ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

  package-repositories:
    name: Sign update feeds
    needs: check-trigger
    if: needs.check-trigger.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    environment: linux-repository
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c flatpak gnupg libarchive-tools makepkg ostree pacman-package-manager rpm zstd
      - name: Fetch and verify the latest stable release
        id: distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url')
          test -n "$pages_url"
          printf 'pages_url=%s\n' "$pages_url" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/release.json"
          tag=$(jq -er 'select(.draft == false and .prerelease == false) | .tag_name' "$RUNNER_TEMP/release.json")
          gh release download --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets" \
            --pattern TruckCraft.deb --pattern TruckCraft.rpm \
            --pattern TruckCraft.pkg.tar.zst --pattern TruckCraft.flatpak -- "$tag"
          (
            cd "$RUNNER_TEMP/assets"
            for file in TruckCraft.deb TruckCraft.rpm TruckCraft.pkg.tar.zst TruckCraft.flatpak; do
              digest=$(jq -er --arg file "$file" '.assets[] | select(.name == $file) | .digest' "$RUNNER_TEMP/release.json")
              [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
              printf '%s  %s\n' "${digest#sha256:}" "$file" | sha256sum --check --strict
            done
          )
      - name: Build signed repositories
        env:
          LINUX_REPOSITORY_SIGNING_KEY: ${{ secrets.LINUX_REPOSITORY_SIGNING_KEY }}
          PAGES_URL: ${{ steps.distribution.outputs.pages_url }}
        run: |
          export GNUPGHOME=$(mktemp -d)
          trap 'gpgconf --kill all; rm -rf -- "$GNUPGHOME"' EXIT
          test -n "$LINUX_REPOSITORY_SIGNING_KEY"
          printf '%s\n' "$LINUX_REPOSITORY_SIGNING_KEY" | gpg --batch --import
          unset LINUX_REPOSITORY_SIGNING_KEY
          fingerprint=$(cat release/linux-repository-fingerprint.txt)
          tag=$(jq -er '.tag_name' "$RUNNER_TEMP/release.json")
          bash release/build-linux-repositories.sh "$RUNNER_TEMP/assets" "$RUNNER_TEMP/site" \
            "$tag" "$fingerprint" "$PAGES_URL" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  publish:
    name: Deploy update feeds
    needs: package-repositories
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
