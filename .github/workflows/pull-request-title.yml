name: Pull request title

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

jobs:
  title:
    name: Check pull request title
    runs-on: ubuntu-26.04
    steps:
      - name: Check the Conventional Commits title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([[:alnum:]_./-]+\))?!?: [^[:space:]].*$'
          if [[ ! ${PR_TITLE,,} =~ $pattern ]]; then
            echo '::error::Use a Conventional Commits title, such as docs: add a support badge to the README.'
            exit 1
          fi
