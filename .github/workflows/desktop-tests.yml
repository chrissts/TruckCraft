name: Desktop tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Workspace tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-26.04, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libgl-dev libegl-dev libxkbcommon-dev libwayland-dev libfontconfig1-dev libdbus-1-dev

      - name: Install workspace toolchain
        run: rustup toolchain install 1.100.0 --profile minimal

      - name: Run workspace tests
        run: cargo +1.100.0 test --locked --workspace
